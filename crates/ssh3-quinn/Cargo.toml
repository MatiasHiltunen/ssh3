[package]
name = "ssh3-quinn"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Quinn transport bindings for the Rust SSH3 runtime"

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.89"
bytes = "1.10.1"
quinn = "0.11.9"
rcgen = "0.14.7"
rustls = "0.23.35"
ssh3-core = { path = "../ssh3-core" }
ssh3-proto = { path = "../ssh3-proto" }
webpki-roots = "1.0.6"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
