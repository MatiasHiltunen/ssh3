[package]
name = "ssh3-quinn"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Quinn transport bindings for the Rust SSH3 runtime"

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
quinn = "0.11.12"
rcgen = "0.14.10"
rustls = "0.23.46"
ssh3-core = { path = "../ssh3-core" }
ssh3-proto = { path = "../ssh3-proto" }
webpki-roots = "1.0.11"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
