[package]
name = "ssh3-server"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Minimal Rust SSH3 server runtime and binary"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ssh3-server"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
h3 = "0.0.8"
http = "1.5.0"
quinn = "0.11.12"
ssh3-auth = { path = "../ssh3-auth" }
ssh3-core = { path = "../ssh3-core" }
ssh3-h3 = { path = "../ssh3-h3" }
ssh3-proto = { path = "../ssh3-proto" }
ssh3-quinn = { path = "../ssh3-quinn" }
tokio = { version = "1.54.1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "time",
] }

[dev-dependencies]
futures-util = "0.3.34"
p256 = { version = "0.14.0", features = ["ecdsa"] }
rsa = { version = "0.9.10", features = ["sha2"] }
ssh-key = { version = "0.6.7", features = ["ed25519", "ecdsa", "rsa"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "signal", "term", "user"] }
