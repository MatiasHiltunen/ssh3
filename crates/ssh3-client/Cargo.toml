[package]
name = "ssh3-client"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Minimal Rust SSH3 client runtime and binary"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ssh3-client"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
h3 = "0.0.8"
http = "1.5.0"
quinn = "0.11.12"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
ssh-key = { version = "0.6.7", features = ["ed25519", "ecdsa", "rsa"] }
ssh3-core = { path = "../ssh3-core" }
ssh3-h3 = { path = "../ssh3-h3" }
ssh3-auth = { path = "../ssh3-auth" }
ssh3-proto = { path = "../ssh3-proto" }
ssh3-quinn = { path = "../ssh3-quinn" }
tokio = { version = "1.54.1", features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "time",
] }
url = "2.5.8"

[dev-dependencies]
p256 = { version = "0.14.0", features = ["ecdsa"] }
rsa = { version = "0.9.10", features = ["sha2"] }
ssh3-server = { path = "../ssh3-server" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["term"] }
