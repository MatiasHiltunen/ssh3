[package]
name = "ssh3-auth"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Shared SSH3 authentication helpers"

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.23.1"
p256 = { version = "0.14.0", features = ["ecdsa"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rsa = { version = "0.9.10", features = ["sha2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signature = "3.0.0"
ssh-key = { version = "0.6.7", features = ["ed25519", "ecdsa", "rsa"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
