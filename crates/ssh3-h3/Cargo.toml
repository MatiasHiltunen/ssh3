[package]
name = "ssh3-h3"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "HTTP/3 transport helpers for the Rust SSH3 rewrite"

[lib]
path = "src/lib.rs"

[dependencies]
bytes = "1.10.1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.3.1"
ssh3-core = { path = "../ssh3-core" }
ssh3-proto = { path = "../ssh3-proto" }
ssh3-quinn = { path = "../ssh3-quinn" }

[dev-dependencies]
futures-util = "0.3.31"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
